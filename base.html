<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪场智能管理系统</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- 你的自定义 CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="d-flex" id="wrapper">

    <!-- 侧边栏 -->
    <div id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom"><i class="bi bi-piggy-bank-fill me-2"></i>中科奥格猪场管理</div>
        
        <div class="list-group list-group-flush">
            <a href="/" class="sidebar-link"><i class="bi bi-house-door me-2"></i> 首页 / 猪只列表</a>
            <a href="/add_pig" class="sidebar-link"><i class="bi bi-plus-circle me-2"></i> 登记新猪</a>
            <a href="/import" class="sidebar-link"><i class="bi bi-file-earmark-arrow-up me-2"></i> 批量导入</a>
            <!-- 可以在这里添加更多菜单，比如报表、库存等 -->
        </div>
    </div>
    <!-- /侧边栏 -->

    <!-- 页面主要内容 -->
    <div id="page-content-wrapper">

        <!-- 顶部导航条 -->
        <nav class="navbar navbar-expand-lg navbar-custom border-bottom">
            <div class="container-fluid">
                <button class="btn btn-outline-success btn-sm" id="sidebarToggle"><i class="bi bi-list"></i> 菜单</button>
                
                <div class="ms-auto d-flex align-items-center">
                    <span class="me-3 text-muted small">欢迎回来，管理员</span>
                    <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 内容容器 -->
        <div class="container-fluid px-4 py-4">
            
            <!-- 消息提示区 -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- 这里是子页面的具体内容 -->
            {% block content %}{% endblock %}

        </div>
    </div>
    <!-- /页面主要内容 -->

</div>

<!-- 引入 Bootstrap JS (包含侧边栏切换功能) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 侧边栏切换逻辑
    document.getElementById("sidebarToggle").addEventListener("click", function(e) {
        e.preventDefault();
        document.body.classList.toggle("sb-sidenav-toggled");
    });
</script>

<!-- 放置页面的特定脚本 -->
{% block scripts %}{% endblock %}

</body>
</html>
