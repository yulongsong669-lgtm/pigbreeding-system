<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>添加新用户</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; border: 1px solid #ccc; padding: 20px; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .back-link { display: block; margin-top: 10px; text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>添加新用户</h2>
        <form method="POST">
            <div class="form-group">
                <label>用户名:</label>
                <input type="text" name="username" required placeholder="请输入用户名">
            </div>
            
            <div class="form-group">
                <label>密码:</label>
                <input type="password" name="password" required placeholder="请输入密码">
            </div>

            <div class="form-group">
                <label>分配权限 (角色):</label>
                <select name="role">
                    <option value="viewer">观察者 - 只能查看数据</option>
                    <option value="operator">操作员 - 可以添加/修改猪只</option>
                    <option value="admin">管理员 - 拥有所有权限</option>
                </select>
            </div>

            <button type="submit">创建用户</button>
        </form>
        <a href="/" class="back-link">返回首页</a>
    </div>
</body>
</html>
