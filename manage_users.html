<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; text-decoration: none; color: white; border-radius: 3px; }
        .btn-add { background-color: #28a745; }
    </style>
</head>
<body>
    <h2>用户权限管理</h2>
    <a href="/add_user" class="btn btn-add">添加新用户</a>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>角色 (权限)</th>
                <th>角色说明</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>
                    <strong>{{ user.role }}</strong>
                </td>
                <td>
                    {% if user.role == 'admin' %} 管理员 (全部权限)
                    {% elif user.role == 'operator' %} 操作员 (可编辑数据)
                    {% elif user.role == 'viewer' %} 观察者 (仅查看)
                    {% endif %}
                </td>
                <td>
                    <form method="POST" action="/reset_password/{{ user.id }}" onsubmit="return confirm('确定要将该用户密码重置为 123456 吗？');">
                        <button type="submit" class="btn btn-reset">重置密码为 123456</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <br>
    <a href="/">返回首页</a>
</body>
</html>
